  <style>
    /* ---- Print page sizing ---- */
    @page { size: A3 landscape; margin: 0; }

    html, body {
      background: var(--bg-primary);
      color: var(--text-primary);
      /* Force dark theme to render in print */
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      color-adjust: exact;
    }

    /* Each surface section becomes a fresh page */
    .print-page {
      width: 1600px;
      min-height: 1100px;
      background: var(--bg-primary);
      break-before: page;
      page-break-before: always;
      position: relative;
      overflow: hidden;
    }
    .print-page:first-child {
      break-before: avoid;
      page-break-before: avoid;
    }

    .print-cover {
      background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-surface) 100%);
    }

    /* Reserve room beneath the page header */
    .print-body {
      width: 100%;
    }

    /* Disable interactive affordances in print */
    @media print {
      button, input { pointer-events: none; }
      /* hide focus-style outlines */
      *:focus, *:focus-visible { outline: none !important; }
      /* break-inside helps the gap cards & hero stay together */
      .print-page > * { break-inside: avoid; }
    }

    /* Screen preview helper (non-print): show pages stacked with a visible boundary */
    @media screen {
      body { padding: 16px; }
      .print-page {
        margin: 0 auto 24px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        border: 1px solid var(--border-default);
      }
    }
  </style>
